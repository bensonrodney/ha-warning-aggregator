[project]
name = "ha-warning-aggregator"
version = "0.1.0"
description = "Home Assistant integration: one problem sensor per set of labels."
readme = "README.md"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "ASYNC"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
