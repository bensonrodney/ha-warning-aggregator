name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# ruff is pinned here so CI is deterministic; bump it in both workflow files
# together and re-run `ruff format` locally.
env:
  RUFF_VERSION: "0.16.5"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .
      - run: uvx "ruff@${RUFF_VERSION}" format --check --diff .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run --python 3.13 --with-requirements requirements_test.txt pytest

  # Runs only for `vX.Y.Z` tags (from `make release`), and only once lint + tests
  # pass. Publishes a Gitea release with the HACS zip attached.
  release:
    name: release
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bump_version.py --check "${{ github.ref_name }}"
      - run: python3 scripts/build_zip.py
      - name: Publish Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          id=$(curl -fsS -X POST "$api/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST \
            "$api/releases/${id}/assets?name=warning_aggregator.zip" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -F 'attachment=@warning_aggregator.zip;type=application/zip'
