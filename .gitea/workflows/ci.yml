name: CI

on:
  push:
    branches: [main]
  pull_request:

# ruff is pinned here so CI is deterministic; bump it in both workflow files
# together and re-run `ruff format` locally.
env:
  RUFF_VERSION: "0.16.5"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .
      - run: uvx "ruff@${RUFF_VERSION}" format --check --diff .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run --python 3.13 --with-requirements requirements_test.txt pytest
