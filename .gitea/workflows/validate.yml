name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The full hacs/action needs the GitHub API (repo description/topics/issues)
      # and home-assistant/brands, none of which a Gitea runner can reach, so it
      # only ever fails here. This runs the file-only HACS checks; the real
      # action runs in .github/workflows/validate.yml once the repo is on GitHub.
      - run: python3 scripts/hacs_check.py
