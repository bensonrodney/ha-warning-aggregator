name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

# home-assistant/actions/hassfest and hacs/action are both Docker actions that
# assume a VM runner + the GitHub API, so on a Gitea container runner they only
# ever fail. These jobs run the file-only equivalents; the real actions run in
# .github/workflows/validate.yml for when the repo is on GitHub.
jobs:
  manifest:
    name: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/manifest_check.py

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/hacs_check.py
