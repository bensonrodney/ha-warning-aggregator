blueprint:
  name: Warning Aggregator — act on a problem
  description: >
    Runs the moment a Warning Aggregator sensor **leaves the OK state** — i.e. as
    soon as anything it watches has a problem (or the sensor itself stops
    reporting). Optionally runs a second action when it goes back to OK.
  domain: automation
  source_url: https://github.com/bensonrodney/ha-warning-aggregator/blob/main/blueprints/automation/warning_aggregator/on_problem.yaml
  input:
    warning_sensor:
      name: Warning sensor
      description: A Warning Aggregator or monitored-entity problem sensor.
      selector:
        entity:
          filter:
            - integration: warning_aggregator
              domain: binary_sensor
    problem_action:
      name: When a problem starts
      description: Runs when the sensor leaves OK.
      selector:
        action: {}
    clear_action:
      name: When it's OK again (optional)
      description: Runs when the sensor returns to OK.
      default: []
      selector:
        action: {}

mode: queued
max: 10

triggers:
  # No `to:` — fires on any departure from OK, so a sensor that goes
  # unavailable counts as a problem too.
  - trigger: state
    entity_id: !input warning_sensor
    from: "off"
    id: problem
  - trigger: state
    entity_id: !input warning_sensor
    to: "off"
    id: clear

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: problem
        sequence: !input problem_action
      - conditions:
          - condition: trigger
            id: clear
        sequence: !input clear_action
