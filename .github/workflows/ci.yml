# GitHub Actions — mirror of .gitea/workflows/ci.yml, used once this repo is on
# GitHub. Gitea ignores .github/workflows when .gitea/workflows exists.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  RUFF_VERSION: "0.16.5"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uvx "ruff@${RUFF_VERSION}" check --output-format=github .
      - run: uvx "ruff@${RUFF_VERSION}" format --check --diff .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run --python 3.13 --with-requirements requirements_test.txt pytest

  # Runs only for `vX.Y.Z` tags (from `make release`), once lint + tests pass.
  # GitHub is the source of truth for released versions.
  release:
    name: release
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bump_version.py --check "${{ github.ref_name }}"
      - run: python3 scripts/build_zip.py
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: warning_aggregator.zip
          generate_release_notes: true
