# GitHub Actions — mirror of .gitea/workflows/validate.yml for when this repo is
# on GitHub (where the GitHub-metadata HACS checks work).
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `topics` just checks the repo's GitHub "About" topics are set — add
          # some (home-assistant, hacs, home-assistant-integration, …) and drop
          # this line. The other 7 checks (description, license, issues,
          # information, hacsjson, integration_manifest, archived) run.
          ignore: topics
